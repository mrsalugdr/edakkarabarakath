<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Edakkara Barakath</title>

  <link
    rel="stylesheet"
    href="style.css?v=20261007"
  >
</head>

<body>

  <!-- HEADER -->

  <header class="topbar">
    <div class="container">

      <h1>EDAKKARA BARAKATH</h1>

      <p>
        Tailoring &amp; Customer Management
      </p>

    </div>
  </header>


  <!-- MAIN -->

  <main class="container">

    <!-- PAGE HEADING -->

    <section class="heading">

      <div>
        <h2>Customer Management</h2>

        <p>
          Manage stitching orders and customer records.
        </p>
      </div>

      <button
        id="refreshBtn"
        type="button"
      >
        ↻ Refresh
      </button>

    </section>


    <!-- NEW CUSTOMER -->

    <section class="card">

      <h2>New Customer</h2>

      <form id="customerForm">

        <div class="grid">

          <!-- CUSTOMER NAME -->

          <div>
            <label for="customerName">
              Customer Name *
            </label>

            <input
              id="customerName"
              name="customerName"
              type="text"
              required
              autocomplete="name"
            >
          </div>


          <!-- PHONE -->

          <div>
            <label for="phone">
              WhatsApp / Phone *
            </label>

            <input
              id="phone"
              name="phone"
              type="tel"
              required
              autocomplete="tel"
              placeholder="Eg: 9747861631"
            >
          </div>


          <!-- PLACE -->

          <div>
            <label for="place">
              Place
            </label>

            <input
              id="place"
              name="place"
              type="text"
            >
          </div>


          <!-- RECEIVED DATE -->

          <div>
            <label for="receivedDate">
              Received Date *
            </label>

            <input
              id="receivedDate"
              name="receivedDate"
              type="date"
              required
            >
          </div>


          <!-- DELIVERY DATE -->

          <div>
            <label for="deliveryDate">
              Delivery Date
            </label>

            <input
              id="deliveryDate"
              name="deliveryDate"
              type="date"
            >
          </div>


          <!-- ITEM -->

          <div>
            <label for="itemType">
              Dress / Item
            </label>

            <input
              id="itemType"
              name="itemType"
              type="text"
              placeholder="Eg: Blouse"
            >
          </div>


          <!-- QUANTITY -->

          <div>
            <label for="quantity">
              Quantity
            </label>

            <input
              id="quantity"
              name="quantity"
              type="number"
              min="1"
              value="1"
            >
          </div>


          <!-- STATUS -->

          <div>
            <label for="stitchingStatus">
              Stitching Status
            </label>

            <select
              id="stitchingStatus"
              name="stitchingStatus"
            >

              <option value="Received">
                Received
              </option>

              <option value="In Progress">
                In Progress
              </option>

              <option value="Ready">
                Ready
              </option>

              <option value="Delivered">
                Delivered
              </option>

            </select>
          </div>


          <!-- MEASUREMENTS -->

          <div class="full">

            <label for="measurements">
              Measurements
            </label>

            <textarea
              id="measurements"
              name="measurements"
              rows="4"
              placeholder="Enter measurements..."
            ></textarea>

          </div>


          <!-- NOTES -->

          <div class="full">

            <label for="specialNotes">
              Special Notes
            </label>

            <textarea
              id="specialNotes"
              name="specialNotes"
              rows="4"
              placeholder="Any special instructions..."
            ></textarea>

          </div>


          <!-- TOTAL -->

          <div>

            <label for="totalAmount">
              Total Amount
            </label>

            <input
              id="totalAmount"
              name="totalAmount"
              type="number"
              min="0"
              step="0.01"
              placeholder="₹ 0"
            >

          </div>


          <!-- ADVANCE -->

          <div>

            <label for="advance">
              Advance
            </label>

            <input
              id="advance"
              name="advance"
              type="number"
              min="0"
              step="0.01"
              placeholder="₹ 0"
            >

          </div>

        </div>


        <!-- SAVE -->

        <button
          class="save"
          type="submit"
        >
          Save Customer
        </button>

      </form>


      <!-- RESULT -->

      <div id="result"></div>

    </section>


    <!-- CUSTOMER RECORDS -->

    <section class="card">

      <div class="recordsHead">

        <div>

          <h2>
            Customer Records
          </h2>

          <p id="customerCount">
            Loading...
          </p>

        </div>


        <!-- SEARCH -->

        <input
          id="searchInput"
          name="search"
          type="search"
          placeholder="Search customer..."
          autocomplete="off"
        >

      </div>


      <!-- RECORDS -->

      <div id="recordsContainer">
        Loading customers...
      </div>

    </section>

  </main>


  <!-- JAVASCRIPT -->

  <script src="script.js?v=20261007"></script>

</body>
</html>
