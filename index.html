<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Edakkara Barakath</title>

  <link
    rel="stylesheet"
    href="style.css?v=20261009"
  >
</head>

<body>

  <header class="topbar">
    <div class="container">

      <div class="brand">
        <h1>EDAKKARA BARAKATH</h1>
        <p>Tailoring &amp; Customer Management</p>
      </div>

    </div>
  </header>


  <main class="container">

    <section class="heading">

      <div>
        <h2>Customer Management</h2>
        <p>Manage stitching orders and customer records.</p>
      </div>

      <button
        id="refreshBtn"
        type="button"
      >
        ↻ Refresh
      </button>

    </section>


    <!-- NEW CUSTOMER -->

    <section class="card">

      <div class="cardTitle">
        <h2>New Customer</h2>
      </div>

      <form id="customerForm">

        <div class="formGrid">

          <div class="field">
            <label for="customerName">
              Customer Name *
            </label>

            <input
              id="customerName"
              name="customerName"
              type="text"
              required
              autocomplete="name"
            >
          </div>


          <div class="field">
            <label for="phone">
              WhatsApp / Phone *
            </label>

            <input
              id="phone"
              name="phone"
              type="tel"
              required
              autocomplete="tel"
              placeholder="Eg: 9747861631"
            >
          </div>


          <div class="field">
            <label for="place">
              Place
            </label>

            <input
              id="place"
              name="place"
              type="text"
            >
          </div>


          <div class="field">
            <label for="receivedDate">
              Received Date *
            </label>

            <input
              id="receivedDate"
              name="receivedDate"
              type="date"
              required
            >
          </div>


          <div class="field">
            <label for="deliveryDate">
              Delivery Date
            </label>

            <input
              id="deliveryDate"
              name="deliveryDate"
              type="date"
            >
          </div>


          <div class="field">
            <label for="itemType">
              Dress / Item
            </label>

            <input
              id="itemType"
              name="itemType"
              type="text"
              placeholder="Eg: Blouse"
            >
          </div>


          <div class="field">
            <label for="quantity">
              Quantity
            </label>

            <input
              id="quantity"
              name="quantity"
              type="number"
              min="1"
              value="1"
            >
          </div>


          <div class="field">
            <label for="stitchingStatus">
              Stitching Status
            </label>

            <select
              id="stitchingStatus"
              name="stitchingStatus"
            >
              <option value="Received">
                Received
              </option>

              <option value="In Progress">
                In Progress
              </option>

              <option value="Ready">
                Ready
              </option>

              <option value="Delivered">
                Delivered
              </option>
            </select>
          </div>


          <div class="field fieldFull">
            <label for="measurements">
              Measurements
            </label>

            <textarea
              id="measurements"
              name="measurements"
              rows="4"
              placeholder="Enter measurements..."
            ></textarea>
          </div>


          <div class="field fieldFull">
            <label for="specialNotes">
              Special Notes
            </label>

            <textarea
              id="specialNotes"
              name="specialNotes"
              rows="4"
              placeholder="Any special instructions..."
            ></textarea>
          </div>


          <div class="field">
            <label for="totalAmount">
              Total Amount
            </label>

            <input
              id="totalAmount"
              name="totalAmount"
              type="number"
              min="0"
              step="0.01"
              placeholder="₹ 0"
            >
          </div>


          <div class="field">
            <label for="advance">
              Advance
            </label>

            <input
              id="advance"
              name="advance"
              type="number"
              min="0"
              step="0.01"
              placeholder="₹ 0"
            >
          </div>

        </div>


        <button
          class="save"
          type="submit"
        >
          Save Customer
        </button>

      </form>


      <div id="result"></div>

    </section>


    <!-- CUSTOMER RECORDS -->

    <section class="card recordsCard">

      <div class="recordsHead">

        <div class="recordsTitle">

          <h2>Customer Records</h2>

          <p id="customerCount">
            Loading...
          </p>

        </div>


        <div class="searchBox">

          <input
            id="searchInput"
            name="search"
            type="search"
            placeholder="Search customer..."
            autocomplete="off"
          >

        </div>

      </div>


      <div id="recordsContainer">
        Loading customers...
      </div>

    </section>

  </main>


  <script src="script.js?v=20261009"></script>

</body>
</html>
